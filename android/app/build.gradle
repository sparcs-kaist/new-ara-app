plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "org.jetbrains.kotlin.plugin.compose"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    /* compileSdkVersion
    - ?�을 컴파?�할 ???�용?�는 SDK??버전
    - compileSdkVersion?�서 지?�한 SDK??Android API�??�용?�게 ??
    - 구�? ?�책(2024.08.31 ?�후�??��? API 버전 34�??�겟팅?�야?????�라 33->34�??�향 */
    //ndk Version?� flutter??기본 ?�공 버전 ?�?�에 ?�동?�로 ?�팅
    compileSdkVersion 36
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "org.sparcs.newara"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-build-configuration.

        /* minSdkVersion
        - ?�이 ?�치?????�는 최소?�의 API 버전 (??버전보다 ??? 것만 지?�하??기기?�는 ?�치 불�?)
        - super_native_extensions?�서 ?�구?�는 최소 버전??23?�로 ?�정 */
        minSdkVersion 23

        /* targetSdkVersion
        - ?�이 ?�스?�되�?최적?�된 Android SDK 버전???��?
        - targetSdkVersion???�당?�는 Android SDK 버전???�두?�두�?개발?�었?�는 ?��? 
        - 구�? ?�책(2024.08.31 ?�후�??��? API 버전 34�??�겟팅?�야?????�라 33->34�??�향 */
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
    namespace 'com.example.new_ara_app'
    buildFeatures {
        viewBinding true
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.3"
    }
}

flutter {
    source '../..'
}
dependencies {
    // Core
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Compose
    implementation "androidx.activity:activity-compose:1.8.2"
    implementation "androidx.compose.ui:ui:1.6.1"
    implementation "androidx.compose.material3:material3:1.2.1"

    // Glance - 버전 ?�일 (1.1.1)
    implementation "androidx.glance:glance:1.1.1"
    implementation "androidx.glance:glance-appwidget:1.1.1"
    implementation "androidx.glance:glance-material3:1.1.1"
    implementation "androidx.glance:glance-preview:1.1.1"
    implementation 'androidx.compose.ui:ui-tooling-preview-android:1.9.5'
    implementation 'androidx.work:work-runtime-ktx:2.11.0'
    debugImplementation "androidx.glance:glance-appwidget-preview:1.1.1"

    // DataStore
    implementation "androidx.datastore:datastore-preferences:1.0.0"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"

    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'

    // OkHttp (?�더/쿠키 ?�정??
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.11'
}
